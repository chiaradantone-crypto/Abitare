/* ═══════════════════════════════════════════════════════
   STORAGE
═══════════════════════════════════════════════════════ */
async function sGet(k){
  try{const r=await window.storage.get(k,true);return r?JSON.parse(r.value):null;}
  catch(e){return null;}
}
async function sSet(k,v){
  try{await window.storage.set(k,JSON.stringify(v),true);}
  catch(e){console.error('Storage error',k,e);}
}
async function sDel(k){try{await window.storage.delete(k,true);}catch(e){}}

async function getPassword(){return(await sGet('ov_password'))||DEFAULT_PASSWORD;}
async function getUsers(){return(await sGet('ov_users'))||DEF_USERS;}
async function saveUsers(u){await sSet('ov_users',u);}
async function getClients(){return(await sGet('ov_clients'))||DEF_CLIENTS;}
async function saveClients(c){await sSet('ov_clients',c);}
async function getAreas(){return(await sGet('ov_areas'))||DEF_AREAS;}
async function saveAreas(a){await sSet('ov_areas',a);}
async function getSchedaFields(){return(await sGet('ov_sfields'))||DEF_SCHEDA_FIELDS;}
async function saveSchedaFields(f){await sSet('ov_sfields',f);}

async function getCD(cid){
  const d=await sGet('ov_cd_'+cid);
  if(d){
    if(!d.objectives) d.objectives=[];
    if(!d.pei) d.pei={intro:'',strengths:'',difficulties:'',strategies:'',note_coord:'',objectives:[]};
    if(!d.pei.objectives) d.pei.objectives=[];
    if(!d.scheda) d.scheda={};
    if(!d.assessments) d.assessments={};
    return d;
  }
  return {assessments:{},scheda:{},pei:{intro:'',strengths:'',difficulties:'',strategies:'',note_coord:'',objectives:[]},objectives:[]};
}
async function saveCD(cid,d){
  syncShow('saving');
  await sSet('ov_cd_'+cid,d);
  syncShow('ok');
}
function syncShow(s){
  const el=document.getElementById('syncInd');if(!el)return;
  el.textContent=s==='saving'?'⏳ Salvataggio...':'☁️ Sincronizzato';
}

/* ═══════════════════════════════════════════════════════

═══════════════════════════════════════════════════════ */
async function doLogin(){
  const code=document.getElementById('codeIn').value.trim().toUpperCase();
  const pw=document.getElementById('pwIn').value.trim();
  const errEl=document.getElementById('loginErr');
  errEl.classList.add('hidden');
  if(!code||!pw){showErr('Inserisci codice e password.');return;}
  const correctPw=await getPassword();
  if(pw!==correctPw){showErr('Password errata.');return;}
  const users=await getUsers();
  const u=users.find(x=>x.id===code);
  if(!u){showErr('Codice operatore non riconosciuto.');return;}
  S.user=u;S.role=u.role;
  document.getElementById('loginWrap').style.display='none';
  const mw=document.getElementById('mainWrap');
  mw.classList.remove('hidden');mw.style.display='flex';

   NAVIGATION
═══════════════════════════════════════════════════════ */
function go(page){
  if(!S.user)return;
  const noClient=['sel','admin'];
  if(!noClient.includes(page)&&!S.client){alert('Seleziona prima un utente dalla sezione "Seleziona".');return;}
  S.page=page;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const el=document.getElementById('n-'+page);if(el)el.classList.add('active');
  chartInst.forEach(c=>{try{c.destroy();}catch(e){}});chartInst=[];
  pendingScores={};openForms={};
  loadPage(page);
}
async function loadPage(p){
  const c=document.getElementById('content');
  c.innerHTML='<div style="padding:2rem;text-align:center"><span class="spinner"></span> Caricamento...</div>';
  try{
    let html='';
    if(p==='sel') html=await pgSel();
    else if(p==='scheda') html=await pgScheda();
    else if(p==='admin') html=await pgAdmin();
    else if(p==='val') html=await pgVal();
    else if(p==='pei') html=await pgPEI();
    else if(p==='obj') html=await pgObj();
    else if(p==='and') html=await pgAnd();
    c.innerHTML=html;
    if(p==='and') setTimeout(drawCharts,120);
  }catch(e){
    c.innerHTML='<div style="padding:1rem;color:#A32D2D;font-size:12px">Errore: '+e.message+'</div>';
    console.error(e);
  }
}

    h+=`<div class="card"><div class="card-hd"><div class="card-hd-l">${area.icon||'📋'} ${x(area.label)}</div></div>`;
    if(!area.items||!area.items.length){
      h+='<div style="font-size:12px;color:var(--color-text-tertiary)">Nessuna competenza in questa area.</div>';
    } else {
      area.items.forEach(item=>{
        const cur=cd.assessments[item.id]||{score:null,history:[]};
        const sc=cur.score;
        const hist=cur.history||[];
        const last=hist.slice(-1)[0];
        const prev=hist.length>1?hist[hist.length-2]:null;
        const iid=String(item.id).replace(/[^a-zA-Z0-9_]/g,'');
        h+=`<div class="item-row">
          <div class="item-lbl">${x(item.label)}</div>
          <div>
            <div class="sbt-wrap">`;
        for(let s=1;s<=5;s++){
          if(isCoord){
            h+=`<button class="sbt${sc===s?' a'+s:''}" disabled>${s}</button>`;
          } else {
            h+=`<button class="sbt${sc===s?' a'+s:''}" data-iid="${iid}" data-score="${s}" onclick="scoreClick(this)">${s}</button>`;
          }
        }
        h+='</div>';
        h+=`<div class="score-hist" id="hist_${iid}">`;
        if(last) h+=`${last.date}${prev?` · <span class="hist-up">da ${prev.score} a ${last.score}</span>`:` · <span class="hist-up">${last.score}</span>`}`;
        h+='</div></div></div>';
      });
    }
    h+='</div>';
  });
  return h;
}
async function scoreClick(btn){
  const iid=btn.getAttribute('data-iid');
  const score=parseInt(btn.getAttribute('data-score'),10);
  if(!iid||!score)return;
  const wrap=btn.closest('.sbt-wrap');
  if(wrap) wrap.querySelectorAll('.sbt').forEach((b)=>{
    const bs=parseInt(b.getAttribute('data-score'),10);
    b.className='sbt'+(bs===score?' a'+bs:'');
  });
  const cd=await getCD(S.client.id);
  if(!cd.assessments[iid]) cd.assessments[iid]={score:null,history:[]};
  const prev=cd.assessments[iid].score;
  cd.assessments[iid].score=score;
  cd.assessments[iid].history.push({score,prev,date:todayStr(),user:S.user.id});
  await saveCD(S.client.id,cd);
  const hEl=document.getElementById('hist_'+iid);
  if(hEl) hEl.innerHTML=`${todayStr()}${prev?` · <span class="hist-up">da ${prev} a ${score}</span>`:` · <span class="hist-up">${score}</span>`}`;
}

  const cd=await getCD(S.client.id);
  (cd.objectives||[]).forEach((obj,oi)=>{
    const canvas=document.getElementById('ch_'+oi);if(!canvas)return;
    const allE=[...(obj.entries||[]),...(obj.subObjectives||[]).flatMap(s=>s.entries||[])];
    const allDates=[...new Set(allE.map(e=>e.date))].sort((a,b)=>dSort(a)-dSort(b));
    if(!allDates.length)return;
    const datasets=[];
    const objE=obj.entries||[];
    if(objE.length){
      datasets.push({label:'Obiettivo generale',
        data:allDates.map(d=>{const e=objE.filter(v=>v.date===d);return e.length?+(e.reduce((a,v)=>a+v.score,0)/e.length).toFixed(2):null;}),
        borderColor:CC[0],backgroundColor:CC[0]+'33',tension:.3,spanGaps:true,pointRadius:4,borderWidth:2});
    }
    (obj.subObjectives||[]).forEach((sub,si)=>{
      const sE=sub.entries||[];if(!sE.length)return;
      const lbl=sub.label.length>30?sub.label.substring(0,30)+'…':sub.label;
      datasets.push({label:lbl,
        data:allDates.map(d=>{const e=sE.filter(v=>v.date===d);return e.length?+(e.reduce((a,v)=>a+v.score,0)/e.length).toFixed(2):null;}),
        borderColor:CC[(si+1)%CC.length],backgroundColor:CC[(si+1)%CC.length]+'22',
        tension:.3,spanGaps:true,pointRadius:3,borderWidth:1.5});
    });
    if(!datasets.length)return;
    const chart=new Chart(canvas,{type:'line',data:{labels:allDates,datasets},
      options:{responsive:true,maintainAspectRatio:false,
        scales:{
          y:{min:0.5,max:5.5,ticks:{stepSize:1,callback:v=>Number.isInteger(v)?(v+' ('+SL[v]+')'):''},grid:{color:'rgba(128,128,128,0.08)'}},
          x:{ticks:{maxRotation:45,autoSkip:true,maxTicksLimit:12},grid:{color:'rgba(128,128,128,0.08)'}}
        },
        plugins:{legend:{display:datasets.length>1,position:'bottom',labels:{font:{size:11},boxWidth:10,padding:8}}}}});
    chartInst.push(chart);
  });
}

function x(s){
  if(s===null||s===undefined)return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function xv(s){return x(s).replace(/'/g,'&#39;');}
function todayStr(){return new Date().toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'});}
function dSort(s){const p=(s||'').split('/');if(p.length!==3)return 0;return new Date(p[2],p[1]-1,p[0]).getTime();}
</script>
